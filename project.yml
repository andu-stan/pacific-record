# XcodeGen spec — generates PacificRecord.xcodeproj from these text files.
# Install once:  brew install xcodegen
# Generate:      xcodegen generate   (then open PacificRecord.xcodeproj)
name: PacificRecord
options:
  bundleIdPrefix: ro.sofistic
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  VinylCore:
    path: VinylCore

targets:
  PacificRecord:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # XcodeGen has no separate "resources" key — every file goes under
      # `sources` and is sorted into the right build phase by type, so the
      # asset catalog (app icon, accent colour) must be listed here too.
      - path: PacificRecord/Sources
      - path: PacificRecord/Resources
      # Compiled into both the app and the widget extension.
      - path: Shared
      # Required-reason API declarations. `buildPhase` is spelled out because
      # XcodeGen infers the phase from the file extension and doesn't know
      # this one — without it the manifest ships nowhere and App Store Connect
      # rejects the upload for a missing declaration.
      - path: PacificRecord/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: VinylCore
        product: VinylCore
      - target: PacificRecordWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.sofistic.pacificrecord
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacificRecord/Info.plist
        # App Groups (for the widgets) live here. The iCloud keys are commented
        # out inside the file — see AppConfig.iCloudEnabled.
        CODE_SIGN_ENTITLEMENTS: PacificRecord/PacificRecord.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PacificRecordWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PacificRecordWidgets
      - path: Shared
      # The bundled type families, so widgets match the app.
      - path: PacificRecord/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.sofistic.pacificrecord.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacificRecordWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacificRecordWidgets/PacificRecordWidgets.entitlements
        SKIP_INSTALL: YES
